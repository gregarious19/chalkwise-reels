name: Render reels

# Renders every new or changed reel spec in scripts/queue/ and attaches the MP4 to a
# GitHub Release named reel-<id>. The release page doubles as the preview link, and its
# download URL is what Instagram fetches when the reel is posted.
on:
  push:
    paths: ["scripts/queue/**.json", "render.py", "tts.py"]
  workflow_dispatch:
    inputs:
      all:
        description: "Re-render every queued reel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools and fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy pillow opencv-python-headless
          mkdir -p assets/fonts
          curl -sSfL -o assets/fonts/Kalam-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/Kalam-Bold.ttf
          curl -sSfL -o assets/fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf

      - name: Find specs to render
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '^(render|tts)\.py$'; then
            ls scripts/queue/*.json 2>/dev/null > specs.txt || true
          else
            git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'scripts/queue/*.json' > specs.txt || true
          fi
          echo "Specs to render:"; cat specs.txt

      - name: Render and publish to releases
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_VOICE: ${{ vars.DEEPGRAM_VOICE }}
        run: |
          mkdir -p out
          while read -r spec; do
            [ -f "$spec" ] || continue
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$spec")
            echo "::group::$id"
            voice_arg=""
            if python3 tts.py "$spec" "out/$id.voice.wav" && [ -f "out/$id.voice.wav" ]; then voice_arg="--voice out/$id.voice.wav"; fi
            python3 render.py "$spec" "out/$id.mp4" $voice_arg
            gh release delete "reel-$id" --yes --cleanup-tag 2>/dev/null || true
            gh release create "reel-$id" "out/$id.mp4" --title "Reel: $id" \
              --notes "$(python3 -c "import json,sys;s=json.load(open(sys.argv[1]));print('Topic: '+s.get('topic','')+'\n\nPosts after: '+s.get('post_after','next slot')+'\n\n'+s.get('caption',''))" "$spec")"
            echo "Preview: https://github.com/${{ github.repository }}/releases/tag/reel-$id"
            echo "::endgroup::"
          done < specs.txt
